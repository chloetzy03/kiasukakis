<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiasu Kakis · Life's too short to queue</title>
    <meta name="description" content="Kiasu Kakis is an iPhone app for Singapore: see the wait, join the queue from your phone, and go live your life. Coming soon." />
    <meta name="theme-color" content="#bd091c" />
    <link rel="icon" href="./icon/favicon.png" />
    <script>
      (function () {
        var s = localStorage.getItem('kk-theme');
        var d = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
